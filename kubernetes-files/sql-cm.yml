apiVersion: v1
kind: ConfigMap
metadata:
  name: sql-init
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS tasks (
      id INT AUTO_INCREMENT PRIMARY KEY,
      title VARCHAR(255) NOT NULL,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    INSERT INTO tasks (title) VALUES
      ('Set up Jenkins pipeline'),
      ('Configure ArgoCD'),
      ('Deploy to EKS');
